[package]
name = "jorb"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
jorb-config-disk = { version = "0.1.0", path = "../jorb-config-disk" }
jorb-vmm = { path = "../jorb-vmm" }
rustix = { version = "1.1.6", features = ["fs"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "process", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
