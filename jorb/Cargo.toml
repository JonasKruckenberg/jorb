[package]
name = "jorb"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
jorb-vmm = { version = "0.1.0", path = "../jorb-vmm" }
rustix = { version = "1.1.6", features = ["fs", "process"] }
secrecy = "0.10.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "process", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
