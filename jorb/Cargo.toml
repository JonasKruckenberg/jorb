[package]
name = "jorb"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
jorb-config-disk = { version = "0.1.0", path = "../jorb-config-disk" }
rustix = { version = "1.1.6", features = ["fs"] }
secrecy = "0.10.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
