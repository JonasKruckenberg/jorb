[package]
name = "jorb-vmm"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
progenitor-client = "0.16.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"

# Only the tests need a runtime; the library does not.
[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[build-dependencies]
openapiv3 = "2.2.0"
progenitor = "0.16.1"
serde_yaml = "0.9"
