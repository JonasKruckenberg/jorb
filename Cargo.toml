[workspace]
members = ["jorb", "jorb-config-disk", "jorb-init"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `all` is a lint group, so it needs a lower priority than the specific lints.
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
# Present in clippy 0.1.100 (checked, not assumed).
infinite_loop = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
